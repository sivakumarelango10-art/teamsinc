name: Weekly live attendance checks

on:
  pull_request:
    paths:
      - 'server/**'
      - 'src/api/attendanceApi.js'
      - 'src/components/meetings/**'
      - 'src/pages/meetings/MeetingHub.jsx'
      - 'supabase/migrations/006_live_weekly_photo_attendance.sql'
      - 'tests/live-attendance-session.test.js'
  push:
    branches:
      - feat/weekly-live-photo-attendance

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test live attendance session logic
        run: node --test tests/live-attendance-session.test.js
